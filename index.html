<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story</title>
    <style>html,body{margin:0;height:100%;background:#04020c;}</style>
    <script type="text/javascript" src="./config.js"></script>
    <script type="text/javascript">
        // 根据 config.js 里的 cinematic 开关，跳转到对应版本
        //   cinematic: true  -> 新的 3D 电影级特效 (cinematic.html)
        //   cinematic: false -> 之前的经典爱情树   (classic.html)
        (function () {
            var useCinematic = (typeof config !== 'undefined') && config.cinematic;
            var target = useCinematic ? './cinematic.html' : './classic.html';
            location.replace(target + location.search + location.hash);
        })();
    </script>
</head>
<body></body>
</html>
